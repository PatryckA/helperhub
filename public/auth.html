<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Logging in | HelperHub</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/hh.css">
  <script src="/assets/hh.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap"><div id="content"><div class="spinner"></div><p class="center muted">Logging you in…</p></div></main>
  <script>
    platformHeader();
    (async () => {
      const token = new URLSearchParams(location.search).get('t') || '';
      history.replaceState(null, '', '/auth'); // keep the one-time token out of browser history
      try {
        const r = await api('/api/auth/verify', { method: 'POST', body: { token } });
        session.set(r.session);
        if (r.next) location.replace(`/${r.next}/admin?welcome=1`);
        else if (r.groups.length === 1 && !r.is_owner) location.replace(`/${r.groups[0].slug}/admin`);
        else location.replace('/login');
      } catch (err) {
        $('#content').innerHTML = `<div class="card" style="max-width:440px;margin:30px auto"><h1 style="margin-top:4px">That link didn't work</h1>
          <div class="notice">${esc(err.message)}</div><a class="btn" href="/login">Get a new login link</a></div>`;
      }
    })();
  </script>
</body>
</html>
