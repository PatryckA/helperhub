<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Team page</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/hh.css">
  <script src="/assets/hh.js"></script>
  <script src="/assets/help.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <div id="content"><div class="spinner"></div></div>
  </main>
  <script>
    // A team manager's private page (no login): their team's upcoming events and ready-made WhatsApp messages
    const token = new URLSearchParams(location.search).get('t') || '';
    const MESSAGES = [
      ['ask', 'Ask for helpers', 'Everything your team still needs'],
      ['gaps', 'Fill the gaps', 'A short follow-up for empty spots'],
      ['roster', "Who's doing what", 'Thanks everyone and shows who signed up'],
    ];

    const slotLine = s => s.kind === 'item'
      ? `<strong>${esc(s.title)}</strong> <span class="muted">(to bring)</span>`
      : `<strong>${esc(s.title)}</strong> <span class="muted">${fmtTime(s.start_time)} to ${fmtTime(s.end_time)}${s.date ? ', ' + esc(fmtDateShort(s.date)) : ''}</span>`;
    const people = s => `${s.names.length ? esc(s.names.join(', ')) : '<span class="muted">Nobody yet</span>'}${s.left ? ` <span class="still">· ${s.left} still needed</span>` : ' <span class="done">· filled</span>'}`;

    (async () => {
      const box = $('#content');
      try {
        const data = await api('/api/team/' + encodeURIComponent(token));
        groupHeader(data.group, '<a href="#" id="hdr-help" class="help-link">Help</a>'); siteFooter(data.group);
        $('#hdr-help').onclick = e => { e.preventDefault(); HHHelp.manager({ group: data.group, team: data.team.name, role: data.role,
          contact: data.contact.email ? `<a href="mailto:${esc(data.contact.email)}">${esc(data.contact.name || data.contact.email)}</a>` : '' }); };
        const role = data.role.charAt(0).toUpperCase() + data.role.slice(1);
        document.title = `${data.team.name}: ${role} page`;
        box.innerHTML = `
          <h1>${esc(data.team.name)}</h1>
          <p class="lead">${data.team.manager_name ? `Hi ${esc(data.team.manager_name.split(' ')[0])}! ` : ''}Here's how your volunteers are tracking. Use the buttons to share a ready-made message in your WhatsApp chat.</p>
          ${data.events.length ? data.events.map(e => {
            const cap = e.mine.reduce((n, s) => n + s.capacity, 0), filled = e.mine.reduce((n, s) => n + s.capacity - s.left, 0);
            return `
            <div class="card" style="margin-bottom:16px">
              <h2 style="margin:0">${esc(e.title)}</h2>
              <div class="muted small">${esc(fmtRange(e.first_date, e.last_date))}${e.location ? ' · ' + esc(e.location) : ''}</div>
              <div class="tally"><b>${filled} of ${cap}</b> ${esc(data.team.name)} spot${cap === 1 ? '' : 's'} filled
                <div class="bar"><i style="width:${cap ? Math.round(filled / cap * 100) : 0}%"></i></div></div>
              ${e.mine.length ? `<ul class="team-slots">${e.mine.map(s => `<li>${slotLine(s)}<br>${people(s)}</li>`).join('')}</ul>`
                : '<p class="muted">No jobs for your team in this event.</p>'}
              <div class="small" style="font-weight:600;margin-top:12px">Share on WhatsApp</div>
              <div class="share-row">${MESSAGES.map(([k, label, hint]) => e.messages[k]
                ? `<button class="btn small ${k === 'ask' ? 'wa' : 'secondary'}" data-ev="${e.id}" data-msg="${k}" title="${esc(hint)}">${esc(label)}</button>` : '').join('')}
                <button class="btn small secondary" data-copy="${esc(e.link)}">Copy sign-up link</button>
              </div>
              ${e.whole_event.length || e.others.length ? `<details style="margin-top:12px"><summary class="small">Rest of the event</summary>
                ${e.others.length ? `<p class="small" style="margin:8px 0 4px">${e.others.map(o => `${esc(o.name)}: ${o.filled} of ${o.capacity}`).join(' · ')}</p>` : ''}
                ${e.whole_event.length ? `<div class="small muted" style="margin-top:6px">Jobs for everyone</div><ul class="team-slots small">${e.whole_event.map(s => `<li>${slotLine(s)}<br>${people(s)}</li>`).join('')}</ul>` : ''}
              </details>` : ''}
            </div>`;
          }).join('') : `<div class="card center"><p><strong>No upcoming events for ${esc(data.team.name)} right now.</strong></p><p class="muted">When your team is added to an event, it'll show up here.</p></div>`}
          <p class="small muted">This page is just for you as ${esc(data.role)}. Please don't share this link, but do share the sign-up links.${data.contact.email ? ` Questions? Contact <a href="mailto:${esc(data.contact.email)}">${esc(data.contact.name || data.contact.email)}</a>.` : ''}</p>`;
        $$('[data-msg]').forEach(b => b.onclick = () => {
          const ev = data.events.find(e => e.id === +b.dataset.ev);
          window.open('https://wa.me/?text=' + encodeURIComponent(ev.messages[b.dataset.msg]), '_blank', 'noopener');
        });
        $$('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Sign-up link copied.'), () => {}));
      } catch (err) {
        platformHeader(); siteFooter();
        box.innerHTML = `<h1>Hmm.</h1><div class="notice">${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
