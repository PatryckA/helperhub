<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>My sign-up</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/hh.css">
  <script src="/assets/hh.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <div id="content"><div class="spinner"></div></div>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('t') || '';

    async function load() {
      const box = $('#content');
      try {
        const data = await api('/api/manage/' + encodeURIComponent(token));
        if (!window._hdr) { groupHeader(data.group); siteFooter(data.group); window._hdr = 1; }
        box.innerHTML = `
          <h1>Hi ${esc(data.first_name)}</h1>
          <p class="lead">Here's what you're signed up for. Plans changed? Cancel a slot so someone else can take it.</p>
          <div class="stack">${data.signups.map(s => `
            <div class="card">
              <div class="muted small">${esc(s.event_title)}${s.location ? ' · ' + esc(s.location) : ''}</div>
              ${s.kind === 'item' ? `
              <div style="font-weight:600;font-size:17px">Bringing ${esc(s.item_desc)} <span class="muted" style="font-weight:400">(${esc(s.title)})</span></div>
              ${s.dietary.length ? `<div>${s.dietary.map(d => `<span class="diet" style="margin:0 4px 0 0">${esc(d)}</span>`).join('')}</div>` : ''}
              <div>Drop off by ${fmtTime(s.start_time)}, ${esc(fmtDate(s.date))}${s.dropoff_note ? ' · ' + esc(s.dropoff_note) : ''}</div>` : `
              <div class="time" style="font-weight:700">${esc(fmtDate(s.date))}, ${fmtTime(s.start_time)} to ${fmtTime(s.end_time)}</div>
              <div style="font-weight:600;font-size:17px">${esc(s.title)}</div>`}
              ${s.details ? `<div class="muted small">${nl2br(s.details)}</div>` : ''}
              <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
                ${s.can_cancel ? `<button class="btn danger small" data-cancel="${s.id}">Cancel</button>` : '<span class="small muted">This has closed.</span>'}
                <a class="btn secondary small" href="/${esc(data.group.slug)}/event/${s.event_id}">See the event</a>
              </div>
            </div>`).join('')}
          </div>`;
        $$('[data-cancel]').forEach(b => b.addEventListener('click', () => cancel(b)));
      } catch (err) {
        if (!window._hdr) { platformHeader(); siteFooter(); window._hdr = 1; }
        box.innerHTML = `<h1>My sign-up</h1><div class="notice">${esc(err.message)}</div>`;
      }
    }

    async function cancel(btn) {
      // two-tap confirm, avoids browser pop-ups
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = 'Tap again to confirm';
        setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = 'Cancel'; }, 4000);
        return;
      }
      btn.disabled = true;
      try {
        await api(`/api/manage/${encodeURIComponent(token)}/${btn.dataset.cancel}`, { method: 'DELETE' });
        toast('Cancelled. Thanks for letting us know.');
        load();
      } catch (err) {
        toast(err.message, 'bad');
        btn.disabled = false;
      }
    }
    load();
  </script>
</body>
</html>
